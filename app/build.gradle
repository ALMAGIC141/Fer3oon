plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fer3oon.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.fer3oon.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        ci {
            storeFile file(System.getenv("ANDROID_KEYSTORE_PATH") ?: "${rootDir}/fer3oon-signing.jks")
            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            keyAlias System.getenv("ANDROID_KEY_ALIAS")
            keyPassword System.getenv("ANDROID_KEY_PASSWORD")
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.ci
        }
    }
}
